{% extends "base.html" %}

{% block styles %}
<style>
    .coder-layout {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 120px);
        gap: 12px;
    }

    /* ---- Transcription buffer ---- */
    .buffer-section {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .buffer-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.5;
    }

    .buffer-display {
        width: 100%;
        min-height: 80px;
        max-height: 160px;
        padding: 10px 12px;
        box-sizing: border-box;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 4px;
        color: #e0e0e0;
        font-size: 0.95rem;
        line-height: 1.5;
        resize: vertical;
        font-family: inherit;
        overflow-y: auto;
    }

    .buffer-display:empty::before {
        content: "Buffer empty — say 'Start Speaking' to begin";
        opacity: 0.35;
    }

    /* ---- Conversation ---- */
    .conversation-section {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .conversation-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.5;
        margin-bottom: 6px;
        flex: 0 0 auto;
    }

    .messages-container {
        flex: 1 1 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-right: 4px;
    }

    .message {
        padding: 10px 14px;
        border-radius: 4px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .message-user {
        background: #1e2a3a;
        border-left: 3px solid #4a90d9;
        align-self: flex-end;
        max-width: 85%;
    }

    .message-assistant {
        background: #1a2a1a;
        border-left: 3px solid #5a9e5a;
        align-self: flex-start;
        max-width: 95%;
    }

    .message-meta {
        font-size: 0.72rem;
        opacity: 0.45;
        margin-bottom: 4px;
        display: flex;
        justify-content: space-between;
    }

    .processing-indicator {
        font-size: 0.8rem;
        opacity: 0.5;
        font-style: italic;
        padding: 6px 0;
        display: none;
    }

    .processing-indicator.active {
        display: block;
    }
</style>
{% endblock %}

{% block content %}
<div class="coder-layout">

    <div class="buffer-section">
        <div class="buffer-label">Transcription Buffer</div>
        <div class="buffer-display" id="bufferDisplay"></div>
        <div class="processing-indicator" id="processingIndicator">Processing…</div>
    </div>

    <div class="conversation-section">
        <div class="conversation-label">Conversation</div>
        <div class="messages-container" id="messagesContainer"></div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
    window.coderConversationId = "{{ conversation_id }}";

    // ---- Buffer display ----

    function updateBuffer(text) {
        const el = document.getElementById('bufferDisplay');
        el.textContent = text || '';
    }

    // ---- Processing indicator ----

    function setProcessing(active) {
        const el = document.getElementById('processingIndicator');
        el.classList.toggle('active', active);
    }

    // ---- Message rendering ----

    function renderMessage(msg) {
        const outer = document.createElement('div');
        outer.className = `message message-${msg.role.toLowerCase()}`;
        outer.dataset.messageId = msg.id;

        const meta = document.createElement('div');
        meta.className = 'message-meta';

        const roleSpan = document.createElement('span');
        roleSpan.textContent = msg.role;
        meta.appendChild(roleSpan);

        if (msg.model_name) {
            const modelSpan = document.createElement('span');
            modelSpan.textContent = msg.model_name;
            meta.appendChild(modelSpan);
        }

        const content = document.createElement('div');
        content.textContent = msg.content;

        outer.appendChild(meta);
        outer.appendChild(content);
        return outer;
    }

    let lastMessageId = null;

    function updateMessages(data) {
        const container = document.getElementById('messagesContainer');
        const atBottom = container.scrollTop + container.clientHeight >= container.scrollHeight - 10;

        const msgs = data.messages || [];

        if (!lastMessageId) {
            msgs.forEach(m => container.appendChild(renderMessage(m)));
        } else {
            let found = false;
            msgs.forEach(m => {
                if (found) container.appendChild(renderMessage(m));
                if (m.id === lastMessageId) found = true;
            });
        }

        if (msgs.length > 0) {
            lastMessageId = msgs[msgs.length - 1].id;
        }

        if (atBottom) {
            container.scrollTop = container.scrollHeight;
        }
    }

    // ---- SSE: conversation updates ----

    eventSource.addEventListener('message', function(event) {
        if (!event.data) return;
        try {
            const data = JSON.parse(event.data);
            if (data.type === 'ConversationUpdateEvent' && data.conversation_id === window.coderConversationId) {
                updateMessages(data.data);
                setProcessing(false);
            }
        } catch (e) {
            console.error('Coder SSE error:', e);
        }
    });

    // ---- Initial load ----

    fetch('/coder_data', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({conversation_id: window.coderConversationId})
    })
    .then(r => r.json())
    .then(d => updateMessages(d.data))
    .catch(e => console.error('Coder load error:', e));

    // ---- Hook send/make_code_change/apply/explore to show processing indicator ----
    //      (These don't have js_return_handlers, so we hook into the fetch manually.)

    const _actionControls = ['send', 'make_code_change', 'apply', 'explore'];
    _actionControls.forEach(id => {
        const btn = document.getElementById(id);
        if (btn) {
            const orig = btn.onclick;
            btn.addEventListener('click', () => setProcessing(true));
        }
    });
</script>
{% endblock %}
